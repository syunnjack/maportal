name: Deploy to WPX

# 注意: WPXはGitHub ActionsのランナーからのSSH接続を拒否する（接続直後に切断される）。
# そのため自動デプロイは現状機能せず、デプロイはローカルからのrsync/scpで行っている。
# 手動実行のみに限定し、pushで毎回失敗し続けないようにしている。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: sqlite3, pdo_sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude="tests" --exclude=".env" --exclude="database/database.sqlite" --exclude="storage/app" --exclude="storage/logs" --exclude="storage/framework"
          path: ./
          remote_path: ${{ secrets.WPX_DEPLOY_PATH }}
          remote_host: ${{ secrets.WPX_SSH_HOST }}
          remote_port: '10022'
          remote_user: ${{ secrets.WPX_SSH_USERNAME }}
          remote_key: ${{ secrets.WPX_SSH_PRIVATE_KEY }}

      - name: Run migrations, cache config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WPX_SSH_HOST }}
          port: 10022
          username: ${{ secrets.WPX_SSH_USERNAME }}
          key: ${{ secrets.WPX_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.WPX_DEPLOY_PATH }}"
            PHP=/usr/bin/php8.3
            mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app
            touch database/database.sqlite
            chmod -R 775 storage database
            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
